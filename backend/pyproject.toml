[project]
name = "backend"
version = "0.1.0"
description = "A backend server running locally"
authors = [
    {name = "Ifigeneia Manolou",email = "ipm33@bath.ac.uk"}
]
readme = "README.md"
requires-python = ">=3.12, <=3.13.10"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "fastapi (>=0.139.1,<0.140.0)",
    "openai (>=2.45.0,<3.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "websockets (>=16.1,<17.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "boto3 (>=1.43.49,<2.0.0)",
    "elevenlabs (>=2.58.0,<3.0.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "aiohttp (>=3.14.3,<4.0.0)"
]

[tool.poetry]
packages = [{include = "server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

