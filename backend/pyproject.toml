[project]
name = "multimodalavatar"
version = "0.1.0"
description = "An application used to create a multimodal avatar, incorporating speech, text and facial animation, through an ASR, NLP, TTS, Facial animation pipeline through UE5."
authors = [{name = "Ifigeneia Manolou",email = "ipm33@bath.ac.uk"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies=["openai (>=2.41.1,<3.0.0)", "faster-whisper (>=1.2.1,<2.0.0)", "py-audio2face (>=0.1.3,<0.2.0)", "dotenv (>=0.9.9,<0.10.0)", "fastapi[standard] (>=0.137.1,<0.138.0)", "uvicorn (>=0.49.0,<0.50.0)", "elevenlabs (>=2.53.0,<3.0.0)", "phonemizer (>=3.3.0,<4.0.0)", "pandas (>=3.0.3,<4.0.0)", "pyloudnorm (>=0.2.0,<0.3.0)", "soundfile (>=0.14.0,<0.15.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "AvatarProject", from = "src"}]
