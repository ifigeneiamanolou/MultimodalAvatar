[project]
name = "multimodalavatar"
version = "0.1.0"
description = "An application used to create a multimodal avatar, incorporating speech, text and facial animation, through an ASR, NLP, TTS, Facial animation pipeline through UE5."
authors = [{name = "Ifigeneia Manolou",email = "ipm33@bath.ac.uk"}]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies=["openai (>=2.41.1,<3.0.0)", "faster-whisper (>=1.2.1,<2.0.0)", "py-audio2face (>=0.1.3,<0.2.0)", "dotenv (>=0.9.9,<0.10.0)", "fastapi[standard] (>=0.137.1,<0.138.0)", "uvicorn (>=0.49.0,<0.50.0)", "pandas (>=3.0.3,<4.0.0)", "pyloudnorm (>=0.2.0,<0.3.0)", "pymongo (>=4.17.0,<5.0.0)", "annotated-types (>=0.7.0,<0.8.0)", "anyio (>=4.14.1,<5.0.0)", "click (>=8.4.2,<9.0.0)", "dnspython (>=2.8.0,<3.0.0)", "email-validator (>=2.3.0,<3.0.0)", "h11 (>=0.16.0,<0.17.0)", "idna (>=3.18,<4.0)", "sniffio (>=1.3.1,<2.0.0)", "starlette (>=1.3.1,<2.0.0)", "typing-extensions (>=4.15.0,<5.0.0)", "faker (>=40.23.0,<41.0.0)", "orpheus-cpp (>=0.0.3,<0.0.4)", "whisperx (>3.8.6)", "boto3 (>=1.43.36,<2.0.0)", "llama-cpp-python @ https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.32/llama_cpp_python-0.3.32-py3-none-win_amd64.whl", "openrouter (>=0.11.1,<0.12.0)", "numba (>=0.61)", "llvmlite (>=0.44)", "funasr (>=1.3.14,<2.0.0)", "torchcodec (>=0.6.0,<0.8.0)", "pyarrow (>=24.0.0,<25.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]
