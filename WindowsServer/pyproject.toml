[project]
name = "remoteserver"
version = "0.1.0"
description = "A FastAPI backend server hosted on AWS to run Emotion2Vec, Whisper and Orpheus3B"
authors = [
    {name = "Ifigeneia Manolou",email = "ipm33@bath.ac.uk"}
]
requires-python = "^3.12, <3.13"
dependencies = [
    "asyncio (>=4.0.0,<5.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "nvidia-cudnn-cu12 (==8.9.7.29)",
    "numpy (<2.5)",
    "faster-whisper (>=1.2.1,<2.0.0)",
    "funasr (>=1.3.14,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "fastapi (>=0.139.1,<0.140.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "numba (>=0.63.1)",
    "llvmlite (>=0.44.0)",
    "websockets (>=16.1.1,<17.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "transformers (>=4.46.0,<5.0.0)",
    "tokenizers (>=0.20.0,<0.24.0)",
    "accelerate (>=1.14.0,<2.0.0)",
    "torch (==2.11.0)",
    "torchvision (==0.26.0)",
    "torchaudio (==2.11.0)",
    "torchcodec (==0.16)",
    "ctranslate2 (==4.4.0)",
]

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "torch"}
torchvision = {source = "torch"}
torchaudio = {source = "torch"}
torchcodec = {source = "torch"}
[tool.poetry]
packages = [{include = "server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"